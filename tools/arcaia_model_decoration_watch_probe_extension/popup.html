<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Model Decoration Watch</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif; }
    * { box-sizing: border-box; }
    body { width: 340px; margin: 0; padding: 14px; background: Canvas; color: CanvasText; font-size: 12px; }
    h1 { margin: 0 0 10px; font-size: 15px; }
    .status { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding: 10px; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 9px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #9aa0a6; }
    .status[data-state="watching"] .dot, .status[data-state="connected_waiting"] .dot { background: #188038; }
    .status[data-state="lost"] .dot, .status[data-state="recovered_marked"] .dot { background: #d93025; }
    .status-title { font-weight: 700; }
    .status-detail { margin-top: 2px; color: GrayText; }
    dl { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 7px 10px; margin: 0 0 12px; }
    dt { color: GrayText; }
    dd { margin: 0; overflow-wrap: anywhere; }
    button { width: 100%; min-height: 34px; border: 1px solid color-mix(in srgb, CanvasText 22%, transparent); border-radius: 7px; background: ButtonFace; color: ButtonText; cursor: pointer; font-weight: 650; }
    button:disabled { opacity: .45; cursor: default; }
    .note { margin: 10px 0 0; color: GrayText; font-size: 11px; line-height: 1.45; }
  </style>
</head>
<body>
  <h1>Model Decoration Watch</h1>
  <div id="status-card" class="status" data-state="waiting">
    <span class="dot" aria-hidden="true"></span>
    <div><div id="status-title" class="status-title">接続確認中</div><div id="status-detail" class="status-detail">ChatGPTタブを確認しています</div></div>
  </div>
  <dl>
    <dt>装飾</dt><dd id="model-state">判定待ち</dd>
    <dt>実設定</dt><dd id="native-value">未確定</dd>
    <dt>Arcaia表示</dt><dd id="arcaia-value">未確定</dd>
    <dt>正常基準</dt><dd id="baseline">未取得</dd>
    <dt>検出回数</dt><dd id="incident-count">0</dd>
    <dt>最終検出</dt><dd id="last-incident">なし</dd>
    <dt>最終更新</dt><dd id="updated-at">未取得</dd>
  </dl>
  <button id="download">JSON保存</button>
  <p class="note">常時監視です。ページ上にはマークを表示しません。JSON保存時に現在状態も自動採取します。停止する場合は拡張機能を無効化してください。</p>
  <script src="popup.js"></script>
</body>
</html>
