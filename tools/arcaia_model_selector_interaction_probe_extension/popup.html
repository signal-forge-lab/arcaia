<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Model Selector Probe</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { width: 330px; margin: 0; padding: 14px; background: #17181b; color: #f4f4f5; }
    h1 { margin: 0 0 10px; font-size: 15px; }
    #status { margin-bottom: 12px; padding: 10px; border: 1px solid #34363c; border-radius: 10px; background: #202126; font-size: 12px; line-height: 1.55; white-space: pre-wrap; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button { min-height: 34px; border: 1px solid #41434a; border-radius: 9px; background: #292b31; color: inherit; cursor: pointer; }
    button:hover { background: #343740; }
    .primary { border-color: #3b82f6; background: #1d4ed8; }
    .wide { grid-column: 1 / -1; }
    .note { margin: 10px 0 0; color: #a1a1aa; font-size: 11px; line-height: 1.45; }
  </style>
</head>
<body>
  <h1>Model Selector Interaction Probe</h1>
  <div id="status">接続確認中…</div>
  <div class="grid">
    <button data-action="mark" data-scenario="overlap">重なりを記録</button>
    <button data-action="mark" data-scenario="chat_selection">Chat選択を記録</button>
    <button data-action="mark" data-scenario="work_selection">Work選択を記録</button>
    <button data-action="capture">現在を記録</button>
    <button data-action="mark" data-scenario="style_classic">Classicを記録</button>
    <button data-action="mark" data-scenario="style_aurora">Auroraを記録</button>
    <button class="primary wide" data-action="save">JSON保存</button>
    <button data-action="reset">記録をリセット</button>
    <button data-action="stop">監視を停止</button>
  </div>
  <p class="note">再現操作の約1秒後に対応する「記録」ボタンを押してください。会話本文・URL・ID・Cookie/Storage生値は保存しません。</p>
  <script src="popup.js"></script>
</body>
</html>
